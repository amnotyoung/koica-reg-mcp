name: ALIO 규정 자동 동기화

# KOICA 현행 규정을 alio.go.kr에서 주기적으로 다시 받아 자동 검증한다.
# 검증 통과 시 PR 생성 → squash 병합 → Fly 배포를 사람 개입 없이 수행한다.

on:
  schedule:
    - cron: "0 0 * * 1"      # 매주 월요일 00:00 UTC (09:00 KST)
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: alio-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 동기화 안전장치 테스트
        run: python3 -m unittest discover -s tests -v

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Fly 도쿄에서 ALIO 동기화
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          MACHINE_ID="$(flyctl machine list --app koica-reg-mcp --json | jq -r '.[0].id')"
          MACHINE_STATE="$(flyctl machine list --app koica-reg-mcp --json | jq -r '.[0].state')"
          test -n "$MACHINE_ID" && test "$MACHINE_ID" != "null"
          if [ "$MACHINE_STATE" != "started" ]; then
            flyctl machine start "$MACHINE_ID" --app koica-reg-mcp
          fi
          flyctl ssh console --app koica-reg-mcp --machine "$MACHINE_ID" --command \
            "rm -rf /tmp/alio-sync-work && mkdir -p /tmp/alio-sync-work && cp /app/alio_sync.py /tmp/alio-sync-work/ && cp -a /app/data /tmp/alio-sync-work/data && cd /tmp/alio-sync-work && python alio_sync.py --fresh --no-build && tar -czf /tmp/alio-sync-data.tar.gz -C /tmp/alio-sync-work/data extracted sources.json"
          flyctl ssh sftp get --app koica-reg-mcp --machine "$MACHINE_ID" \
            /tmp/alio-sync-data.tar.gz ./alio-sync-data.tar.gz
          tar -xzf alio-sync-data.tar.gz -C data

      - name: 전체 검색 인덱스 검증
        run: python3 koica_search.py build
        # index.json은 gitignore 대상이라 PR에는 규정 원문과 sources.json만 포함된다.

      - name: 변경분 PR 생성·자동 병합·배포
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/extracted data/sources.json; then
            echo "변경 없음 — 이미 최신 상태"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="auto/alio-sync"
          COUNT=$(python3 -c "import json;print(json.load(open('data/sources.json')).get('count','?'))")
          git switch -C "$BRANCH"
          git add data/extracted data/sources.json
          git commit -m "chore(sync): ALIO 현행 규정 자동 동기화 (${COUNT}개, $(date -u +%Y-%m-%d))"
          git push -f origin "$BRANCH"
          PR_NUMBER="$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')"
          if [ -z "$PR_NUMBER" ]; then
            PR_URL="$(gh pr create --base main --head "$BRANCH" \
              --title "chore(sync): ALIO 현행 규정 자동 동기화" \
              --body "ALIO에서 감지된 KOICA 규정 변경분입니다. 규정 삭제·개정일 역행·수집 수량·변환 완전성·전체 인덱스 빌드 검증을 통과해 자동 병합합니다. (자동 생성)")"
            PR_NUMBER="${PR_URL##*/}"
            echo "PR #${PR_NUMBER} 생성 완료"
          else
            echo "기존 PR #${PR_NUMBER} 갱신 완료"
          fi
          gh pr merge "$PR_NUMBER" --squash --delete-branch
          echo "PR #${PR_NUMBER} 자동 병합 완료"
          gh workflow run fly-deploy.yml --ref main
          echo "Fly 배포 워크플로 호출 완료"
