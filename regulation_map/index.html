<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KOICA 규정 지도</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="data.js"></script><script defer src="map_model.js"></script><script defer src="app.js"></script>
</head>
<body>
  <header class="masthead">
    <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">K<span>↗</span></span><span>KOICA <b>규정 지도</b></span><span class="prototype">PROTOTYPE</span></a>
    <div class="header-right"><span class="status-dot"></span><span id="review-coverage">업무 내용검토</span> <button id="about" class="text-button">데이터 안내 ↗</button></div>
  </header>
  <div class="workspace">
    <aside class="sidebar">
      <h1>업무 선택</h1>
      <label for="department-search">부서 찾기</label>
      <input id="department-search" type="search" placeholder="부서명 또는 본부명 검색" autocomplete="off">
      <label for="department" class="sr-only">부서 선택</label><select id="department"></select>
      <p id="department-path" class="department-path"></p>
      <div class="duty-heading"><span>담당업무 선택</span><span id="duty-count" class="count"></span></div>
      <div id="duties" class="duties"></div>
      <div class="sidebar-footer"><span class="small-dot"></span><div>업무분장 원문 기반<br><span id="org-revision"></span></div></div>
    </aside>
    <main>
      <div class="map-heading">
        <div><div class="section-eyebrow">관련 규정</div><h2 id="map-title">관련 규정</h2><p id="map-subtitle" class="muted"></p></div>
        <button id="reset" class="outline-button">↶ 업무 지도로</button>
      </div>
      <div class="search-row">
        <div class="reg-search"><span aria-hidden="true">⌕</span><label for="regulation-search" class="sr-only">전체 규정에서 찾기</label><input id="regulation-search" type="search" placeholder="규정 이름으로도 탐색할 수 있어요" autocomplete="off"><div id="search-results" class="search-results" hidden></div></div>
        <button id="view-toggle" class="outline-button" aria-pressed="false">목록으로 보기</button>
      </div>
      <div class="priority-controls">
        <label for="priority-filter">확인 순서로 보기</label>
        <select id="priority-filter"><option value="all">전체 관계</option><option value="core">먼저 확인만</option><option value="supporting">함께 확인</option><option value="conditional">해당할 때</option><option value="unassessed">순서 미평가</option></select>
      </div>
      <section class="map-shell" aria-label="규정 관계 탐색">
        <div class="map-toolbar"><div class="legend"><span id="reference-legend"><i class="line explicit"></i>원문 참조 →</span><span id="work-legend"><i class="line reviewed"></i>업무 내용 판단</span></div><label id="work-links-control" class="filter"><input id="show-reviewed" type="checkbox" checked>업무 연결</label></div>
        <div id="map-summary" class="map-summary" aria-live="polite"></div>
        <div id="graph" class="graph"><svg id="map-svg" viewBox="0 0 1100 720" role="group" aria-label="규정 관계 지도. 노드를 선택해 연결 근거를 확인하세요."><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8fa6a2"/></marker></defs><g id="viewport"></g></svg></div>
        <div id="list-view" class="list-view" hidden></div>
        <nav id="neighbor-pager" class="neighbor-pager" aria-label="연결된 규정 페이지" hidden><button id="previous-neighbors" class="outline-button">이전</button><span id="neighbor-page-label" aria-live="polite"></span><button id="next-neighbors" class="outline-button">다음</button></nav>
        <div class="map-bottom"><span id="graph-hint">노드를 선택하면 연결 이유를 볼 수 있어요</span><div class="zoom"><button id="zoom-out" aria-label="축소">−</button><button id="zoom-reset" aria-label="지도 배율 초기화">100%</button><button id="zoom-in" aria-label="확대">＋</button></div></div>
      </section>
    </main>
    <aside class="inspector" aria-label="선택한 관계와 근거">
      <div class="section-eyebrow">연결 근거</div>
      <div id="detail" aria-live="polite"></div>
    </aside>
  </div>
  <dialog id="info-dialog"><button id="close-info" class="close" aria-label="안내 닫기">×</button><h2>데이터와 검토 범위</h2><div id="data-info"></div></dialog>
  <noscript>규정 지도를 사용하려면 JavaScript를 활성화해주세요.</noscript>
</body>
</html>
