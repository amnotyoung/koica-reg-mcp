name: ALIO 규정 자동 동기화

# KOICA 현행 규정을 alio.go.kr에서 주기적으로 다시 받아 자동 검증한다.
# 검증 통과 시 PR 생성 → squash 병합 → Fly 배포를 사람 개입 없이 수행한다.

on:
  schedule:
    - cron: "0 0 * * 1"      # 매주 월요일 00:00 UTC (09:00 KST)
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: alio-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # 액션은 태그가 아니라 커밋 SHA로 고정한다(태그는 상류에서 이동 가능).
      # 갱신은 Dependabot이 주간 PR로 제안한다 — .github/dependabot.yml 참고.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: 검색 런타임 의존성 설치
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: 의미 검색 모델 캐시
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/koica-semantic-model
          key: koica-semantic-e5-small-614241f622f53c4eeff9890bdc4f31cfecc418b3

      - name: 의미 검색 모델 준비
        env:
          KOICA_SEMANTIC_MODEL_DIR: ${{ runner.temp }}/koica-semantic-model
        run: python3 semantic_search.py download-model --model-dir "$KOICA_SEMANTIC_MODEL_DIR"

      - name: 동기화 안전장치 테스트
        run: python3 -m unittest discover -s tests -v

      - name: Setup Fly CLI
        # 바로 다음 스텝이 이 액션이 설치한 flyctl을 FLY_API_TOKEN과 함께 실행하므로
        # 가변 브랜치(@master)를 쓰지 않는다. (fly-deploy.yml과 동일한 핀)
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: Fly 도쿄에서 ALIO 동기화
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          MACHINE_ID="$(flyctl machine list --app koica-reg-mcp --json | jq -r '.[0].id')"
          test -n "$MACHINE_ID" && test "$MACHINE_ID" != "null"
          PAUSE_FILE="/data/semantic-search.paused"
          unpause_semantic() {
            for cleanup_attempt in 1 2 3; do
              if flyctl ssh console --app koica-reg-mcp --machine "$MACHINE_ID" \
                --command "rm -f $PAUSE_FILE"; then
                return 0
              fi
              echo "의미 검색 일시정지 해제 재시도 ${cleanup_attempt}/3"
              sleep 2
            done
            return 1
          }
          trap 'unpause_semantic || true' EXIT

          MACHINE_STATE="$(flyctl machine list --app koica-reg-mcp --json | jq -r '.[0].state')"
          if [ "$MACHINE_STATE" = "stopped" ]; then
            flyctl machine start "$MACHINE_ID" --app koica-reg-mcp
          fi
          flyctl ssh console --app koica-reg-mcp --machine "$MACHINE_ID" \
            --command "touch $PAUSE_FILE"
          # 재시작으로 이미 적재된 ONNX 메모리를 비운다. 표식이 유지되는 동안
          # 공개 요청은 자동으로 기존 키워드 검색을 사용하므로 Node/kordoc와 겹치지 않는다.
          flyctl machine restart "$MACHINE_ID" --app koica-reg-mcp

          SYNC_COMPLETE=false
          for attempt in $(seq 1 12); do
            MACHINE_STATE="$(flyctl machine list --app koica-reg-mcp --json | jq -r '.[0].state')"
            if [ "$MACHINE_STATE" = "stopped" ]; then
              if ! flyctl machine start "$MACHINE_ID" --app koica-reg-mcp; then
                MACHINE_STATE="$(flyctl machine list --app koica-reg-mcp --json | jq -r '.[0].state')"
                test "$MACHINE_STATE" = "starting" -o "$MACHINE_STATE" = "started"
              fi
            fi
            STARTED_AT=$SECONDS
            if flyctl ssh console --app koica-reg-mcp --machine "$MACHINE_ID" \
              --command "sh -lc 'rm -rf /tmp/alio-sync-work && mkdir -p /tmp/alio-sync-work && cp /app/alio_sync.py /tmp/alio-sync-work/ && cp -a /app/data /tmp/alio-sync-work/data && cd /tmp/alio-sync-work && python alio_sync.py --fresh --no-build && tar -czf /tmp/alio-sync-data.tar.gz -C /tmp/alio-sync-work/data extracted sources.json && base64 -w 0 /tmp/alio-sync-data.tar.gz'" \
              > alio-sync-data.tar.gz.b64; then
              SYNC_COMPLETE=true
              break
            fi
            ELAPSED=$((SECONDS - STARTED_AT))
            if [ "$ELAPSED" -ge 30 ]; then
              echo "Fly 원격 동기화가 시작된 뒤 실패했습니다. 연결 재시도하지 않습니다."
              exit 1
            fi
            echo "SSH 연결 준비 대기 ${attempt}/12"
            sleep 5
          done
          test "$SYNC_COMPLETE" = "true"
          base64 --decode alio-sync-data.tar.gz.b64 > alio-sync-data.tar.gz
          tar -xzf alio-sync-data.tar.gz -C data
          unpause_semantic
          trap - EXIT

      - name: 전체 검색 인덱스 검증
        env:
          KOICA_SEMANTIC_MODEL_DIR: ${{ runner.temp }}/koica-semantic-model
          KOICA_SEMANTIC_THREADS: "4"
        run: |
          python3 koica_search.py build --strict-semantic
          python3 tests/evaluate_semantic_quality.py
        # 키워드·의미 인덱스는 gitignore 대상이라 PR에는 규정 원문과 sources.json만 포함된다.

      - name: 변경분 PR 생성·자동 병합·배포
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/extracted data/sources.json; then
            echo "변경 없음 — 이미 최신 상태"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="auto/alio-sync"
          COUNT=$(python3 -c "import json;print(json.load(open('data/sources.json')).get('count','?'))")
          git switch -C "$BRANCH"
          git add data/extracted data/sources.json
          git commit -m "chore(sync): ALIO 현행 규정 자동 동기화 (${COUNT}개, $(date -u +%Y-%m-%d))"
          git push -f origin "$BRANCH"
          PR_NUMBER="$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')"
          if [ -z "$PR_NUMBER" ]; then
            PR_URL="$(gh pr create --base main --head "$BRANCH" \
              --title "chore(sync): ALIO 현행 규정 자동 동기화" \
              --body "ALIO에서 감지된 KOICA 규정 변경분입니다. 규정 삭제·개정일 역행·수집 수량·변환 완전성·전체 인덱스 빌드 검증을 통과해 자동 병합합니다. (자동 생성)")"
            PR_NUMBER="${PR_URL##*/}"
            echo "PR #${PR_NUMBER} 생성 완료"
          else
            echo "기존 PR #${PR_NUMBER} 갱신 완료"
          fi
          gh pr merge "$PR_NUMBER" --squash --delete-branch
          echo "PR #${PR_NUMBER} 자동 병합 완료"
          gh workflow run fly-deploy.yml --ref main
          echo "Fly 배포 워크플로 호출 완료"
