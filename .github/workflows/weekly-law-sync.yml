name: Weekly external law review
on:
  schedule:
    - cron: '23 0 * * 1'  # Monday 09:23 Asia/Seoul
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-external-law-review
  cancel-in-progress: false

jobs:
  first:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/law-sync-attempt.yml
    with:
      final_attempt: false
  retry:
    needs: first
    if: needs.first.outputs.retry == 'true'
    uses: ./.github/workflows/law-sync-attempt.yml
    with:
      final_attempt: true
