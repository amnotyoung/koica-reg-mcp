name: Regulation Map Pages

# 규정 지도를 단일 HTML로 묶어 GitHub Pages에 배포한다.
# 사람이 push한 지도·데이터 변경은 아래 경로 조건으로, ALIO 주간 동기화의
# 자동 병합은 alio-sync.yml이 workflow_dispatch로 직접 호출해 다시 배포한다.
on:
  push:
    branches:
      - main
    paths:
      - "regulation_map/**"
      - "data/extracted/**"
      - "data/sources.json"
      - "koica_search.py"
      - "tests/test_regulation_*.py"
      - "tests/test_map_model.cjs"
      - ".github/workflows/regulation-map-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regulation-map-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 액션은 태그가 아니라 커밋 SHA로 고정한다(다른 워크플로와 같은 정책).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      # 지도 빌드는 표준 라이브러리만 사용한다. 검증이 실패하면 배포하지 않는다.
      - name: Test regulation map
        run: |
          python -m unittest discover -s tests -p 'test_regulation_map.py'
          python -m unittest discover -s tests -p 'test_regulation_documents.py'
          node tests/test_map_model.cjs
      - name: Build single-file map
        run: |
          python regulation_map/build.py
          python regulation_map/bundle.py --out _site/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
