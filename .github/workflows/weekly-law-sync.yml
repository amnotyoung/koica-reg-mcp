name: Weekly external law review
on:
  schedule:
    - cron: '23 0 * * 1'  # Monday 09:23 Asia/Seoul
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-external-law-review
  cancel-in-progress: false

jobs:
  review:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned HTML parser
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r tools/law-sync/requirements-ci.txt
      - name: Verify change detection and review handling
        run: python -m unittest discover -s tools/law-sync -p 'test_sync.py'
      - name: Compare official editions
        id: compare
        run: |
          rc=0
          python tools/law-sync/sync.py --report "$RUNNER_TEMP/law-review.md" || rc=$?
          test -s "$RUNNER_TEMP/law-review.md"
          cat "$RUNNER_TEMP/law-review.md" >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- regulation_map/law_mapping.json regulation_map/law_excerpts.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Validate proposed map
        if: steps.compare.outputs.changed == 'true'
        run: |
          python -m unittest discover -s tests -p 'test_regulation_map.py'
          python regulation_map/build.py
          python regulation_map/bundle.py
      - name: Check existing proposal before replacement
        id: proposal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh pr list --base "${{ github.event.repository.default_branch }}" --head auto/external-law-review --state open --json number --jq '.[0].number // empty')
          publish=true
          if [ -n "$existing" ]; then
            human=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$existing/commits" --jq '.[] | select(.author.login != "github-actions[bot]") | .sha')
            if [ -n "$human" ] || [ "${{ steps.compare.outputs.rc }}" != 0 ]; then
              publish=false
              echo "기존 PR #$existing 보존: 수동 수정 또는 불완전한 조회" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Open or refresh the review PR
        if: steps.proposal.outputs.publish == 'true' && (steps.compare.outputs.changed == 'true' || steps.compare.outputs.rc == '0')
        uses: peter-evans/create-pull-request@98357b18bf14b5342f975ff684046ec3b2a07725 # v8.0.0
        with:
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          branch: auto/external-law-review
          title: 'chore(map): 상위법령 판본·발췌 주간 검토'
          commit-message: 'chore(map): 상위법령 판본·발췌 주간 검토'
          body-path: ${{ runner.temp }}/law-review.md
          add-paths: |
            regulation_map/law_excerpts.json
            regulation_map/law_mapping.json
      - name: Surface incomplete source checks
        if: steps.compare.outputs.rc != '0'
        run: exit 1
